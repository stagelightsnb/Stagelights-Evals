<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stagelights Evaluations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── TOKENS ── */
:root {
  --gold: #BFA134; --gold-l: #ceb24a; --gold-d: #896f1c;
  --border: #c5b880; --lbl: #f0ece0; --alt: #f6f3e8;
  --text: #1a190e; --muted: #5a5030;
  --surf: #fff; --bg: #e8e4d8;
  --topbar: #080806; --danger: #c0392b; --ok: #2d7d4e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font-family:'Inter',sans-serif}
textarea,input,select{font-family:'Inter',sans-serif;color:var(--text)}
/* TOP BAR */
.topbar{background:var(--topbar);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-l{display:flex;align-items:center;gap:10px}
.logo-studio{font-family:'Playfair Display',Georgia,serif;font-size:17pt;font-weight:900;line-height:1}
.logo-sub{font-size:7pt;letter-spacing:3.5px;text-transform:uppercase;color:var(--gold);margin-top:1px}
#save-badge{font-size:7.5pt;color:#888;min-width:60px;text-align:right}
/* LEVEL TABS */
.tabs{background:var(--topbar);border-bottom:2px solid var(--gold);display:flex;padding:0 20px;gap:0}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;
  padding:8px 16px;font-size:8pt;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:#777;transition:color .15s,border-color .15s}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.on){color:#bbb}
/* MAIN */
.main{padding:20px;max-width:1100px;margin:0 auto}
/* HOME */
.home-hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.home-title{font-family:'Playfair Display',serif;font-size:14pt;font-weight:700}
.home-styles{font-size:8pt;color:var(--muted);margin-top:2px;letter-spacing:.3px}
.btn-new{background:var(--gold);color:#fff;border:none;padding:8px 18px;font-size:8.5pt;font-weight:600;letter-spacing:.3px}
.btn-new:hover{background:var(--gold-d)}
.eval-list{display:flex;flex-direction:column;gap:5px}
.eval-card{background:var(--surf);border:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.eval-card:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(191,161,52,.14)}
.ec-name{font-weight:700;font-size:10pt;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-month{font-size:8.5pt;color:var(--muted);white-space:nowrap}
.ec-status{font-size:7.5pt;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.s-draft{color:#999}.s-complete{color:var(--ok)}
.ec-age{font-size:7.5pt;color:#bbb;text-align:right;min-width:70px}
.ec-check{width:17px;height:17px;cursor:pointer;accent-color:var(--gold);flex-shrink:0;margin-right:2px}
.eval-card.selected{border-color:var(--gold);background:var(--lbl)}
.bulk-bar{display:flex;align-items:center;justify-content:space-between;
  background:var(--topbar);color:#fff;padding:8px 16px;margin-bottom:8px;font-size:8.5pt}
.bulk-bar-l{display:flex;align-items:center;gap:10px}
.bulk-count{color:var(--gold);font-weight:700}
.btn-bulk-del{background:var(--danger);border:none;color:#fff;padding:6px 14px;font-size:8pt;font-weight:600}
.btn-bulk-del:hover{background:#a93226}
.btn-bulk-cancel{background:none;border:1px solid #555;color:#bbb;padding:6px 12px;font-size:8pt}
.btn-bulk-cancel:hover{border-color:#999;color:#fff}
.empty-state{text-align:center;padding:52px 20px;color:#bbb;font-size:9pt;line-height:1.8}
/* EDIT NAV */
.edit-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn-back{background:none;border:none;color:var(--gold-d);font-size:9pt;font-weight:600;
  display:flex;align-items:center;gap:4px;padding:0}
.btn-back:hover{color:var(--gold)}
.edit-dancer{font-family:'Playfair Display',serif;font-size:12pt;font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-complete{border:1.5px solid var(--gold);background:none;color:var(--gold-d);
  padding:6px 14px;font-size:8pt;font-weight:600}
.btn-complete.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-complete:hover:not(.done){background:var(--lbl)}
.btn-print{background:var(--topbar);color:#fff;border:none;padding:7px 15px;font-size:8pt;font-weight:600}
.btn-print:hover{background:#222}
.btn-del{background:none;border:1px solid #ddd;color:#bbb;padding:6px 12px;font-size:8pt}
.btn-del:hover{border-color:var(--danger);color:var(--danger)}
/* SCORING KEY */
.score-key{display:flex;align-items:center;flex-wrap:nowrap;gap:0 8px;
  background:var(--topbar);border-bottom:1px solid var(--gold-d);
  padding:5px 16px;font-size:7pt;color:#ccc;margin-bottom:10px;white-space:nowrap;overflow:hidden}
.sk-label{font-weight:700;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;font-size:7pt;margin-right:4px}
.sk-item b{color:var(--gold-l);margin-right:2px}
.sk-sep{color:#555}
/* FORM */
.form-wrap{display:flex;flex-direction:column;gap:6px}
.section-block{background:var(--surf);border:1px solid var(--border);overflow:hidden}
.sec-hdr{background:var(--gold);color:#fff;font-weight:600;font-size:9pt;letter-spacing:.4px;padding:5px 10px}
.info-grid{display:grid;grid-template-columns:auto 1fr auto 1fr}
.info-lbl{background:var(--lbl);padding:5px 10px;font-size:8pt;font-weight:600;color:var(--muted);
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
.info-inp{border:none;border-bottom:1px solid var(--border);padding:5px 10px;font-size:8.5pt;background:var(--surf);width:100%}
.info-inp:focus{outline:2px solid var(--gold);outline-offset:-2px;z-index:1;position:relative}
.info-ro{background:var(--lbl);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.ev{width:100%;border-collapse:collapse;font-size:8pt}
table.ev th,table.ev td{border:1px solid var(--border)}
.th-e{background:var(--lbl);width:1%}
.th-s{background:var(--gold-l);color:#fff;font-weight:600;text-align:center;font-size:7.5pt;padding:4px 5px}
.td-c{background:var(--lbl);white-space:nowrap;padding:2px 8px;font-size:7.5pt;font-weight:500;color:var(--muted)}
.td-alt .td-c{background:var(--alt)}
.td-sc{text-align:center;background:var(--surf)}
.td-alt .td-sc{background:var(--alt)}
select.sc{border:none;background:transparent;font-size:8pt;font-weight:700;color:var(--text);
  width:46px;text-align:center;padding:2px 0;appearance:none;-webkit-appearance:none;cursor:pointer}
select.sc:focus{outline:2px solid var(--gold);border-radius:2px}
table.nt{width:100%;border-collapse:collapse;font-size:8pt}
table.nt th,table.nt td{border:1px solid var(--border)}
.td-nl{background:var(--lbl);white-space:nowrap;padding:4px 8px;font-size:7.5pt;
  font-weight:600;color:var(--muted);vertical-align:top;width:1%}
.td-na{padding:0;vertical-align:top}
textarea.nt{border:none;width:100%;min-height:46px;padding:5px 7px;resize:vertical;font-size:7.5pt;background:var(--surf)}
textarea.nt:focus{outline:2px solid var(--gold);outline-offset:-2px;z-index:1;position:relative}
textarea.ov{border:none;width:100%;min-height:72px;padding:8px 10px;font-size:8.5pt;resize:vertical;background:var(--surf)}
textarea.ov:focus{outline:2px solid var(--gold);outline-offset:-2px}
.loading-msg{text-align:center;padding:60px;color:#aaa;font-size:9pt}
.db-error{background:#fff3f3;border:1px solid #fcc;padding:20px;text-align:center;color:#c00;font-size:9pt;margin:24px;line-height:1.7}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;padding:24px 28px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal-box h3{font-family:'Playfair Display',serif;font-size:12pt;margin-bottom:8px}
.modal-box p{font-size:8.5pt;color:var(--muted);margin-bottom:18px;line-height:1.5}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{background:none;border:1px solid var(--border);padding:7px 16px;font-size:8.5pt;font-weight:600;color:var(--muted)}
.btn-confirm-del{background:var(--danger);border:none;color:#fff;padding:7px 16px;font-size:8.5pt;font-weight:600}
@media(max-width:600px){
  .info-grid{grid-template-columns:auto 1fr}
  .edit-nav{gap:6px}
}
</style>
</head>
<body>
<div id="app"><div class="loading-msg">Loading…</div></div>
<script>
/* ══════════════════════════════════════════════════
   CONFIGURATION — paste your Apps Script URL below
   ══════════════════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0HJWa6n27IbkoUzb3CkFUt2We8VtNP3-Ny2vRuYIth7sNf5MPDO4fgSX4ZQZBmZ0/exec';

/* ── DATA CONFIG ── */
const SHEETS=[
  {key:'mini',  label:'Mini',       styles:['Ballet','Acro','Hip Hop']},
  {key:'lvl1',  label:'Level 1',    styles:['Hip Hop','Acro','Jazz','Ballet']},
  {key:'lvl15', label:'Level 1.5',  styles:['Acro','Hip Hop','Tech / Ballet','Musical Theatre','Lyrical','Jazz']},
  {key:'lvl2',  label:'Level 2',    styles:['Acro','Hip Hop','Technique','Jazz','Contemporary']},
  {key:'lvl34', label:'Level 3 & 4',styles:['Lyrical','Jazz','Technique','Acro','Hip Hop','Contemporary']},
];
const TECH=['Technique Execution','Control & Body Awareness','Strength','Flexibility',
            'Coordination','Musicality & Timing','Retention'];
const BEHAV=['Focus in Class','Effort & Work Ethic','Ability to Take Corrections',
             'Respect','Participation','Attendance'];
const NOTE_FIELDS=['strengths','growth'];
const NOTE_LABELS=['Strengths / Monthly Stand Out','Areas for Growth'];

const sk=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ago=ts=>{const d=(Date.now()-ts)/1000;return d<60?'just now':d<3600?`${Math.round(d/60)}m ago`:d<86400?`${Math.round(d/3600)}h ago`:`${Math.round(d/86400)}d ago`};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ── STATE ── */
let VIEW='home', SEL='mini', LIST=[], CUR=null;
let saveTimer=null, saveErr=false, saveMsg='';
let SELECTED=new Set();

const sheet=k=>SHEETS.find(s=>s.key===k)||SHEETS[0];
const curSheet=()=>sheet(CUR?.levelKey||SEL);

/* ── API ── */
async function apiGet(params){
  if(!SCRIPT_URL||SCRIPT_URL.includes('PASTE_YOUR'))throw new Error('SCRIPT_URL not configured');
  const url=new URL(SCRIPT_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));
  const res=await fetch(url.toString());
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}

async function apiPost(data){
  if(!SCRIPT_URL||SCRIPT_URL.includes('PASTE_YOUR'))throw new Error('SCRIPT_URL not configured');
  const fd=new FormData();
  fd.append('data',JSON.stringify(data));
  const res=await fetch(SCRIPT_URL,{method:'POST',body:fd});
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}

/* ── INIT ── */
async function init(){
  if(!SCRIPT_URL||SCRIPT_URL.includes('PASTE_YOUR')){
    document.getElementById('app').innerHTML=`<div class="db-error">
      <b>Setup needed:</b> Open this HTML file and replace<br>
      <code>https://script.google.com/macros/s/AKfycbwl8Vtxk5amZCw6uX8hyuwrXazQchEfgp2eGwGNf83QBAjeFfBg36qi4mABadGhnwLV_A/exec</code><br>
      with your Google Apps Script URL.<br><br>
      See the setup instructions included with this file.
    </div>`;
    return;
  }
  render();
  await loadList(SEL);
}

/* ── LOAD ── */
async function loadList(levelKey){
  setBadge('Loading…');
  try{
    const data=await apiGet({action:'list',levelKey});
    if(data.error)throw new Error(data.error);
    LIST=data||[];
    if(VIEW==='home')render();
    setBadge('');
  }catch(e){
    console.error(e);
    setBadge('Load failed — check connection',true);
  }
}

/* ── ACTIONS ── */
function selLevel(key){
  if(VIEW==='edit')return;
  SEL=key; LIST=[]; SELECTED.clear();
  render(); loadList(key);
}

function goHome(){
  clearTimeout(saveTimer);
  CUR=null; VIEW='home'; render();
  loadList(SEL);
}

function openEval(id){
  const ev=LIST.find(e=>e.id===id);
  if(!ev)return;
  CUR=JSON.parse(JSON.stringify(ev)); // deep copy
  VIEW='edit'; render();
  setTimeout(()=>document.getElementById('inp-dancerName')?.focus(),100);
}

async function createEval(){
  const sh=sheet(SEL);
  const tech={},behav={},notes={};
  sh.styles.forEach(style=>{
    const stk=sk(style);
    tech[stk]={}; behav[stk]={}; notes[stk]={strengths:'',growth:''};
    TECH.forEach(c=>{tech[stk][sk(c)]=''});
    BEHAV.forEach(c=>{behav[stk][sk(c)]=''});
  });
  CUR={
    id: genId(),
    dancerName:'',instructor:'',
    month:new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    level:sh.label,levelKey:SEL,styles:sh.styles,
    status:'draft',lastModified:Date.now(),
    tech,behav,notes,overallNotes:''
  };
  VIEW='edit'; render();
  setTimeout(()=>document.getElementById('inp-dancerName')?.focus(),100);
  await saveFull(); // persist immediately
}

function toggleSelect(id,e){
  e.stopPropagation();
  if(SELECTED.has(id))SELECTED.delete(id);else SELECTED.add(id);
  render();
}

function bulkDelete(){
  const count=SELECTED.size;
  if(!count)return;
  const modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML=`
    <div class="modal-box">
      <h3>Delete ${count} Evaluation${count>1?'s':''}?</h3>
      <p>This will permanently delete <b>${count}</b> evaluation${count>1?'s':''}. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-confirm-del" id="modal-confirm">Delete ${count}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('modal-cancel').onclick=()=>modal.remove();
  document.getElementById('modal-confirm').onclick=async()=>{
    modal.remove();
    setBadge('Deleting…');
    try{
      const ids=[...SELECTED];
      for(const id of ids){
        const ev=LIST.find(e=>e.id===id);
        if(ev)await apiGet({action:'delete',levelKey:ev.levelKey,id});
      }
      SELECTED.clear();
      await loadList(SEL);
      setBadge('Deleted ✓');
    }catch(e){setBadge('Delete failed',true);}
  };
}

function deleteEval(){
  if(!CUR)return;
  const name=CUR.dancerName||'this dancer';
  const modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML=`
    <div class="modal-box">
      <h3>Delete Evaluation?</h3>
      <p>This will permanently delete the evaluation for <b>${esc(name)}</b>. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-confirm-del" id="modal-confirm">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('modal-cancel').onclick=()=>modal.remove();
  document.getElementById('modal-confirm').onclick=async()=>{
    modal.remove();
    setBadge('Deleting…');
    try{
      await apiGet({action:'delete',levelKey:CUR.levelKey,id:CUR.id});
      goHome();
    }catch(e){setBadge('Delete failed',true);}
  };
}

async function toggleComplete(){
  if(!CUR)return;
  CUR.status=CUR.status==='complete'?'draft':'complete';
  render();
  await saveFull();
}

/* ── SAVE ── */
function setBadge(msg,isErr){
  if(isErr)saveErr=true; else if(msg==='')saveErr=false;
  saveMsg=msg;
  const el=document.getElementById('save-badge');
  if(el){el.textContent=msg;el.style.color=saveErr?'#e05555':'#888';}
}

function schedSave(){
  setBadge('Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveFull,800);
}

async function saveFull(){
  if(!CUR)return;
  clearTimeout(saveTimer);
  CUR.lastModified=Date.now();
  try{
    const result=await apiPost(CUR);
    if(result.error)throw new Error(result.error);
    saveErr=false;
    setBadge('Saved ✓');
    // Keep LIST in sync
    const idx=LIST.findIndex(e=>e.id===CUR.id);
    const snap=JSON.parse(JSON.stringify(CUR));
    if(idx>=0)LIST[idx]=snap; else LIST.unshift(snap);
  }catch(e){
    console.error('Save error:',e);
    setBadge('Save failed — check connection',true);
  }
}

/* ── INPUT HANDLERS ── */
function onInfo(field,val){
  CUR[field]=val;
  if(field==='dancerName'){const el=document.querySelector('.edit-dancer');if(el)el.textContent=val||'New Evaluation'}
  schedSave();
}

function onScore(sec,stk,crk,val){
  CUR[sec][stk][crk]=val;
  schedSave();
}

function onNote(stk,field,val){
  CUR.notes[stk][field]=val;
  schedSave();
}

function onOverall(val){
  CUR.overallNotes=val;
  schedSave();
}

/* ── DOWNLOAD ── */
async function dlSave({filename,html}){
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

/* ── RENDER ── */
function render(){
  const app=document.getElementById('app');
  const tabs=SHEETS.map(s=>`<button class="tab${SEL===s.key&&VIEW==='home'?' on':''}" onclick="selLevel('${s.key}')">${s.label}</button>`).join('');
  const topbar=`
    <div class="topbar">
      <div class="topbar-l">
        ${logoSVG(42)}
        <div><div class="logo-studio">Stagelights</div><div class="logo-sub">Monthly Evaluations</div></div>
      </div>
      <div id="save-badge" style="color:${saveErr?'#e05555':'#888'}">${esc(saveMsg)}</div>
    </div>
    <div class="tabs">${tabs}</div>`;
  const body=VIEW==='home'?buildHome():buildEdit();
  app.innerHTML=topbar+body;
}

/* HOME */
function buildHome(){
  const sh=sheet(SEL);
  const hasSel=SELECTED.size>0;
  const bulkBar=hasSel?`
    <div class="bulk-bar">
      <div class="bulk-bar-l">
        <span class="bulk-count">${SELECTED.size} selected</span>
        <button class="btn-bulk-del" onclick="bulkDelete()">🗑 Delete Selected</button>
      </div>
      <button class="btn-bulk-cancel" onclick="SELECTED.clear();render()">Cancel</button>
    </div>`:'';
  const cards=LIST.length===0
    ?`<div class="empty-state">No evaluations yet for ${sh.label}.<br>Click <b>+ New Evaluation</b> to get started.</div>`
    :LIST.map(ev=>`
      <div class="eval-card${SELECTED.has(ev.id)?' selected':''}" onclick="openEval('${ev.id}')">
        <input type="checkbox" class="ec-check" ${SELECTED.has(ev.id)?'checked':''} onclick="toggleSelect('${ev.id}',event)">
        <div class="ec-name">${esc(ev.dancerName)||'<em style="color:#bbb;font-weight:400">(unnamed)</em>'}</div>
        <div class="ec-month">${esc(ev.month||'')}</div>
        <div class="ec-status ${ev.status==='complete'?'s-complete':'s-draft'}">${ev.status==='complete'?'✓ Complete':'● Draft'}</div>
        <div class="ec-age">${ev.lastModified?ago(ev.lastModified):''}</div>
      </div>`).join('');
  return`<div class="main">
    <div class="home-hdr">
      <div>
        <div class="home-title">${sh.label} Evaluations</div>
        <div class="home-styles">${sh.styles.join(' · ')}</div>
      </div>
      <button class="btn-new" onclick="createEval()">+ New Evaluation</button>
    </div>
    ${bulkBar}
    <div class="eval-list">${cards}</div>
  </div>`;
}

/* EDIT */
function buildEdit(){
  if(!CUR)return'';
  const ev=CUR;
  const sh=curSheet();

  const info=`<div class="section-block">
    <div class="sec-hdr">Dancer / Class Info</div>
    <div class="info-grid">
      <div class="info-lbl">Dancer Name</div>
      <input id="inp-dancerName" class="info-inp" value="${esc(ev.dancerName)}" placeholder="Full name"
        oninput="onInfo('dancerName',this.value)">
      <div class="info-lbl">Instructor</div>
      <input class="info-inp" value="${esc(ev.instructor)}" placeholder="Instructor name"
        oninput="onInfo('instructor',this.value)">
      <div class="info-lbl">Level</div>
      <input class="info-inp info-ro" value="${esc(ev.level)}" readonly>
      <div class="info-lbl">Evaluation Month</div>
      <input class="info-inp" value="${esc(ev.month)}" placeholder="e.g. October 2026"
        oninput="onInfo('month',this.value)">
    </div>
  </div>`;

  function evalTable(title,sec,criteria){
    const styleHdrs=sh.styles.map(s=>`<th class="th-s">${esc(s)}</th>`).join('');
    const rows=criteria.map((c,i)=>{
      const crk=sk(c);
      const cells=sh.styles.map(style=>{
        const stk=sk(style);
        const val=(ev[sec]?.[stk]?.[crk])||'';
        return`<td class="td-sc"><select class="sc" data-sec="${sec}" data-stk="${stk}" data-crk="${crk}"
          onchange="onScore('${sec}','${stk}','${crk}',this.value)">
          <option value="">—</option>${[1,2,3,4,5].map(n=>`<option${val==n?' selected':''}>${n}</option>`).join('')}
        </select></td>`;
      }).join('');
      return`<tr class="${i%2?'td-alt':''}"><td class="td-c">${esc(c)}</td>${cells}</tr>`;
    }).join('');
    return`<div class="section-block">
      <div class="sec-hdr">${title}</div>
      <div class="tbl-wrap"><table class="ev">
        <thead><tr><th class="th-e"></th>${styleHdrs}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  const noteStyleHdrs=sh.styles.map(s=>`<th class="th-s">${esc(s)}</th>`).join('');
  const noteRows=NOTE_FIELDS.map((field,li)=>{
    const cells=sh.styles.map(style=>{
      const stk=sk(style);
      const val=(ev.notes?.[stk]?.[field])||'';
      return`<td class="td-na"><textarea class="nt" oninput="onNote('${stk}','${field}',this.value)"
        placeholder="…">${esc(val)}</textarea></td>`;
    }).join('');
    return`<tr><td class="td-nl">${esc(NOTE_LABELS[li])}</td>${cells}</tr>`;
  }).join('');
  const notesSection=`<div class="section-block">
    <div class="sec-hdr">Style Specific Instructor Notes</div>
    <div class="tbl-wrap"><table class="nt">
      <thead><tr><th class="th-e"></th>${noteStyleHdrs}</tr></thead>
      <tbody>${noteRows}</tbody>
    </table></div>
  </div>`;

  const overall=`<div class="section-block">
    <div class="sec-hdr">Instructor Notes Continued <span style="font-weight:400;opacity:.75">(Optional)</span></div>
    <textarea class="ov" oninput="onOverall(this.value)" placeholder="Additional notes…">${esc(ev.overallNotes||'')}</textarea>
  </div>`;

  return`<div class="main" style="max-width:none;padding:16px 20px">
    <div class="edit-nav">
      <button class="btn-back" onclick="goHome()">← All ${esc(ev.level)} Evaluations</button>
      <div class="edit-dancer">${esc(ev.dancerName)||'New Evaluation'}</div>
      <button class="btn-complete${ev.status==='complete'?' done':''}" onclick="toggleComplete()">
        ${ev.status==='complete'?'✓ Complete — Reopen':'Mark Complete'}
      </button>
      <button class="btn-print" onclick="printEval()">🖨 Save as PDF</button>
      <button class="btn-del" onclick="deleteEval()">Delete</button>
    </div>
    <div class="score-key">
      <span class="sk-label">Scoring Key:</span>
      <span class="sk-item"><b>1</b> Needs Improvement</span>
      <span class="sk-sep">·</span>
      <span class="sk-item"><b>2</b> Progressing</span>
      <span class="sk-sep">·</span>
      <span class="sk-item"><b>3</b> Consistent, Room for Improvement</span>
      <span class="sk-sep">·</span>
      <span class="sk-item"><b>4</b> Strong</span>
      <span class="sk-sep">·</span>
      <span class="sk-item"><b>5</b> Advanced / Exceeding</span>
    </div>
    <div class="form-wrap">
      ${info}
      ${evalTable('Technical Evaluation','tech',TECH)}
      ${evalTable('Class Behavior & Work Ethic','behav',BEHAV)}
      ${notesSection}
      ${overall}
    </div>
  </div>`;
}

async function printEval(){
  if(!CUR)return;
  const sh=curSheet();
  const styles=CUR.styles||sh.styles;
  const n=styles.length;
  const ls=n>=5;
  const GOLD='#BFA134',GOLD_L='#ceb24a',GOLD_D='#896f1c',BORDER='#c5b880';
  const tf=n<=3?'8.5pt':n===4?'8pt':n===5?'7.5pt':'7pt';
  const hf=n<=3?'9pt':n===4?'8.5pt':n===5?'8pt':'7.5pt';
  const rh=n<=3?'19px':n===4?'17px':n===5?'16px':'15px';
  const nh=n<=3?'30px':n===4?'26px':n===5?'24px':'22px';
  const oh=n<=3?'23px':n===4?'21px':n===5?'20px':'18px';
  const lsz=n<=3?78:n===4?73:n===5?68:64;
  const ocount=ls?3:5;

  const sc=(sec,stk,crk)=>esc((CUR[sec]?.[stk]?.[crk])||'');
  const noteVal=(stk,f)=>esc((CUR.notes?.[stk]?.[f])||'');

  const colgroup=`<colgroup><col style="width:1%">${styles.map(()=>'<col>').join('')}</colgroup>`;

  const techRows=TECH.map((c,i)=>{
    const cls=i%2?' style="background:#f6f3e8"':'';
    const cells=styles.map(st=>{
      const v=sc('tech',sk(st),sk(c));
      return`<td style="text-align:center;height:${rh};background:${i%2?'#f6f3e8':'#fff'};border:1px solid ${BORDER}">${v}</td>`;
    }).join('');
    return`<tr><td style="background:${i%2?'#f6f3e8':'#f0ece0'};padding:1px 7px;white-space:nowrap;font-weight:500;color:#3a3520;height:${rh};border:1px solid ${BORDER}">${esc(c)}</td>${cells}</tr>`;
  }).join('');

  const behavRows=BEHAV.map((c,i)=>{
    const cells=styles.map(st=>{
      const v=sc('behav',sk(st),sk(c));
      return`<td style="text-align:center;height:${rh};background:${i%2?'#f6f3e8':'#fff'};border:1px solid ${BORDER}">${v}</td>`;
    }).join('');
    return`<tr><td style="background:${i%2?'#f6f3e8':'#f0ece0'};padding:1px 7px;white-space:nowrap;font-weight:500;color:#3a3520;height:${rh};border:1px solid ${BORDER}">${esc(c)}</td>${cells}</tr>`;
  }).join('');

  const noteRows=['strengths','growth'].map((f,i)=>{
    const labels=['Strengths / Monthly Stand Out','Areas for Growth'];
    const cells=styles.map(st=>`<td style="height:${nh};background:#fff;vertical-align:top;border:1px solid ${BORDER};padding:4px 6px;font-size:7.5pt">${noteVal(sk(st),f)}</td>`).join('');
    return`<tr><td style="background:#f0ece0;padding:4px 8px;white-space:nowrap;font-weight:600;color:#3a3520;height:${nh};vertical-align:top;border:1px solid ${BORDER}">${labels[i]}</td>${cells}</tr>`;
  }).join('');

  const overallRows=Array(ocount).fill(0).map(()=>`<tr><td style="height:${oh};background:#fff;border:1px solid ${BORDER}"></td></tr>`).join('');

  const styleHeaders=styles.map(s=>`<th style="background:${GOLD_L};color:#fff;font-weight:600;text-align:center;padding:3px 5px;font-size:calc(${tf}*0.93);border:1px solid ${BORDER}">${esc(s)}</th>`).join('');
  const ghStyle=`background:${GOLD};color:#fff;font-weight:600;font-size:${hf};text-align:center;padding:4px 6px;border:1px solid ${BORDER}`;
  const logoB64=logoSVG(0); // get raw tag
  // Extract src from the img tag
  const b64match=logoB64.match(/src="([^"]+)"/);
  const logoSrc=b64match?b64match[1]:'';

  const html=`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Evaluation – ${esc(CUR.dancerName||'Dancer')} – ${esc(CUR.month||'')}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#fff;color:#1a190e;font-size:${tf}}
table{width:100%;border-collapse:collapse;font-size:${tf};font-family:'Inter',Arial,sans-serif}
@media print{
  @page{size:letter ${ls?'landscape':'portrait'};margin:0.28in 0.32in}

}
</style>
</head>

    <img src="${logoSrc}" width="${lsz}" height="${lsz}" style="flex-shrink:0;border-radius:50%">
    <div>
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:23pt;font-weight:900;line-height:1;color:#080808">Stagelights Dancer</div>
      <div style="font-size:8.5pt;letter-spacing:4px;text-transform:uppercase;color:#666;margin-top:2px">Monthly Evaluation</div>
      <div style="font-size:8.5pt;font-weight:700;color:${GOLD_D};letter-spacing:1.5px;text-transform:uppercase;margin-top:5px">${esc(CUR.level||sh.label)}</div>
    </div>
  </div>
  <div style="border:1.5px solid ${GOLD};padding:6px 14px;text-align:center;min-width:168px">
    <div style="font-family:'Playfair Display',serif;font-size:7.5pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${GOLD_D};border-bottom:1px solid ${BORDER};padding-bottom:4px;margin-bottom:4px">Evaluation Structure</div>
    <div style="font-size:7pt;line-height:1.65;color:#333"><b style="color:${GOLD_D}">1</b> = Needs Improvement</div>

  </div>
</div>

<table style="margin-bottom:4px">
  <thead><tr><th colspan="4" style="${ghStyle}">Dancer / Class Info</th></tr></thead>
  <tbody>
    <tr>
      <td style="background:#f0ece0;font-weight:600;padding:3px 7px;white-space:nowrap;color:#3a3520;border:1px solid ${BORDER}">Dancer Name</td>
      <td style="padding:3px 6px;border:1px solid ${BORDER}">${esc(CUR.dancerName||'')}</td>
      <td style="background:#f0ece0;font-weight:600;padding:3px 7px;white-space:nowrap;color:#3a3520;border:1px solid ${BORDER}">Instructor</td>
      <td style="padding:3px 6px;border:1px solid ${BORDER}">${esc(CUR.instructor||'')}</td>
    </tr>
    <tr>
      <td style="background:#f0ece0;font-weight:600;padding:3px 7px;white-space:nowrap;color:#3a3520;border:1px solid ${BORDER}">Level</td>
      <td style="padding:3px 6px;border:1px solid ${BORDER}">${esc(CUR.level||sh.label)}</td>
      <td style="background:#f0ece0;font-weight:600;padding:3px 7px;white-space:nowrap;color:#3a3520;border:1px solid ${BORDER}">Evaluation Month</td>
      <td style="padding:3px 6px;border:1px solid ${BORDER}">${esc(CUR.month||'')}</td>
    </tr>
  </tbody>
</table>

<table style="margin-bottom:4px">
  <thead>
    <tr><th colspan="${1+n}" style="${ghStyle}">Technical Evaluation</th></tr>
    <tr><th style="background:#f0ece0;border:1px solid ${BORDER}"></th>${styleHeaders}</tr>
  </thead>
  <tbody>${techRows}</tbody>
</table>

<table style="margin-bottom:4px">
  <thead>
    <tr><th colspan="${1+n}" style="${ghStyle}">Class Behavior &amp; Work Ethic</th></tr>
    <tr><th style="background:#f0ece0;border:1px solid ${BORDER}"></th>${styleHeaders}</tr>
  </thead>
  <tbody>${behavRows}</tbody>
</table>

<table style="margin-bottom:4px">
  <thead>
    <tr><th colspan="${1+n}" style="${ghStyle}">Style Specific Instructor Notes</th></tr>
    <tr><th style="background:#f0ece0;border:1px solid ${BORDER}"></th>${styleHeaders}</tr>
  </thead>
  <tbody>${noteRows}</tbody>
</table>

<table>
  <thead><tr><th style="${ghStyle}">Instructor Notes Continued (Optional)</th></tr></thead>
  <tbody>
    ${overallRows}
    ${CUR.overallNotes?`<tr><td style="padding:6px 8px;border:1px solid ${BORDER};font-size:8pt">${esc(CUR.overallNotes)}</td></tr>`:''}
  </tbody>
</table>

<script>window.onload=()=>window.print()<\/script>
</body></html>`;

  const w=window.open('','_blank');
  if(w){
    w.document.write(html);
    w.document.close();
  } else {
    // Popup blocked — fall back to HTML download
    const name=(CUR.dancerName||'Evaluation').replace(/[^a-zA-Z0-9 ]/g,'').trim();
    const month=(CUR.month||'').replace(/[^a-zA-Z0-9 ]/g,'').trim();
    await dlSave({filename:`${name}${month?' - '+month:''}.html`, html});
  }
}

init();
</script>
</body>
</html>
